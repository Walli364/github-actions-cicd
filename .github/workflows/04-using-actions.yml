name: using actions

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: setup node
        run: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: install dependencies
        run: npm install
