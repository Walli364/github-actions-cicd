name: 09 functions

on:
  pull_request:
  workflow_dispatch:

jobs:
  echo1:
    runs-on: ubuntu-latest
    steps:
      - name: Failing step
        run: exit 1
      - name: I will be skipped
        if: ${{ success() }}
        run: echo "I will be skipped if the previous steps succeed"
      - name: I will execute
        if: ${{ failure() }}
        run: echo "I will print if the previous steps fail"
      - name: I will execute
        if: ${{ !cancelled() }}
        run: echo "I will print if the workflow is not cancelled"
      - name: I will execute when cancelled
        if: ${{ cancelled() }}
        run: echo "I will print if the workflow is cancelled"