name: workflow runners

on: push

jobs:
  ubuntu-echo:
    runs-on: ubuntu-latest
    steps:
      - name: show OS
        run: |
          echo "This job is running on an ubuntu runner"
          echo "runner OS: ${{ runner.os }}"
          
  windows-echo:
    runs-on: windows-latest
    steps:
      - name: show OS
        shell: bash
        run: |
          echo "This job is running on an windows runner"
          echo "runner OS: ${{ runner.os }}"