name: 16 - working with environments
run-name: 16 - working with environments | env - ${{ github.event.inputs.target-env }}

on:
  workflow_dispatch:
    inputs:
      target-env:
        type: environment
        default: staging

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      my_env_value: ${{ vars.MY_ENV_VAR || 'default-value' }}
    steps:
      - name: echo vars
        run: |
          echo "env variable: ${{ env.my_env_value }}"

  e2e-tests:
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: running e2e tests
        run: |
          echo "Running e2e tests..."

  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e-tests
    environment: prod
    env:
      my_env_value: ${{ vars.MY_ENV_VAR || 'default-value' }}
    steps:
      - name: echo vars
        run: |
          echo "env variable: ${{ env.my_env_value }}"

  deploy-prod-frontend:
    runs-on: ubuntu-latest
    needs: e2e-tests
    environment: prod
    env:
      my_env_value: ${{ vars.MY_ENV_VAR || 'default-value' }}
    steps:
      - name: echo vars
        run: |
          echo "deploying prod frontend"

  deploy-prod-backend:
    runs-on: ubuntu-latest
    needs: e2e-tests
    environment: prod
    env:
      my_env_value: ${{ vars.MY_ENV_VAR || 'default-value' }}
    steps:
      - name: echo vars
        run: |
          echo "deploying prod backend"