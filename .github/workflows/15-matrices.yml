name: 15 - working with matrices

on:
  workflow_dispatch:

jobs:
  backwards-compatibility:
    name: ${{ matrix.os }}-${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [18.x, 20.x, 21.x]
        os:
          - ubuntu-latest
          - windows-latest
          # - macos-latest
        # include:
        #   - os: ubuntu-latest
        #     node-version: 18.x
        #   - os: ubuntu-latest
        #     node-version: 21.x
        #     tag: experimental
    steps:
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: fail if experimental
        if: matrix.tag == 'experimental'
        run: exit 1
      - name: perform some tests
        run: |
         'echo "Running tests on os: ${{ matrix.os }} with node version: ${{ matrix.node-version }}"'
          sleep 10
      - name: upload test results
        run: echo "Uploading test results..."

  include-example:
    name: ${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        color: [red, green]
        shape: [circle, square]
        size: [small, large]
        include:
          - color: blue
            shape: triangle
            size: medium
    steps:
      - name: dummy step
        run: echo "${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}"