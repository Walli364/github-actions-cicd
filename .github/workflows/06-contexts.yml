name: Contexts
run-name: Contexts | Debug - ${{ inputs.debug }}

on:
  push:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        default: false

env:
  MY_WORKFLOW_VAR: "workflow"
  MY_OVERWRITTEN_VAR: "workflow"

jobs:
  echo-data:
    runs-on: ubuntu-latest
    env:
      MY_JOB_VAR: "job"
      MY_OVERWRITTEN_VAR: "job"
    steps:
      - name: display information about the workflow run
        run: |
          echo "Workflow name: ${{ github.workflow }}"
          echo "Workflow run ID: ${{ github.run_id }}"
          echo "Workflow run number: ${{ github.run_number }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Event path: ${{ github.event_path }}"
          echo "Repository name: ${{ github.repository }}"
          echo "Repository owner: ${{ github.repository_owner }}"
          echo "Actor: ${{ github.actor }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"

      - name: retrieve variables
        run: |
          echo "variable value: ${{ vars.MY_VAR }}"

      - name: print env variables
        env:
          MY_OVERWRITTEN_VAR: "step"
        run: |
          echo "MY_WORKFLOW_VAR: ${{MY_WORKFLOW_VAR}}"
          echo "MY_JOB_VAR: ${{MY_JOB_VAR}}"
          echo "MY_OVERWRITTEN_VAR: ${{MY_OVERWRITTEN_VAR}}"

  echo-data2:
    runs-on: ubuntu-latest
    steps:
      - name: print evn variables
        run: | 
          echo "MY_WORKFLOW_VAR: $MY_WORKFLOW_VAR"
          echo "MY_JOB_VAR: $MY_JOB_VAR"
          echo "MY_OVERWRITTEN_VAR: $MY_OVERWRITTEN_VAR"

              